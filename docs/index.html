    <link rel="icon" type="image/png" href="images/favicon.png">
</head>

<body>

    <!-- Header -->
    <header>
        <a href="index.html" id="logo-link" class="active">
            <img src="images/logo.png" alt="EchoBreak Logo" class="logo">
        </a>
        <nav>
            <ul>
                <li><a href="about.html">О нас</a></li>

                <li><a href="fanfics.html">Комьюнити</a></li>

                    <a href="personal_account.html" class="account-icon">
                        <img src="images/avatar-placeholder.png" alt="Аккаунт">
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <!-- Separator Line -->
    <div class="separator"></div>

    <!-- Main Content -->
    <main>
        <!-- New Year Countdown -->
        <div id="ny-countdown" class="countdown-above-title"></div>

        <h1>EchoBreak</h1>
        <h2>Главная</h2>
        <h3>Этот сайт был сделан исключительно в образовательных целях!</h3>

        <!-- CUBE -->
        <div id="cube">
            <canvas id="rast"></canvas>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>EchoBreak © 2025-2026</p>
    </footer>

    <!-- Falling Snow Container -->
    <div id="snow-container"></div>

    <script>
        const snowContainer = document.getElementById('snow-container');
        const flakes = ['*', '·', '✦', '✧', '+', '∘', '•'];
        const snowCount = 35;

        snowContainer.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        `;

        for (let i = 0; i < snowCount; i++) {
            const flake = document.createElement('span');
            flake.textContent = flakes[Math.floor(Math.random() * flakes.length)];
            const size = 8 + Math.random() * 10;
            const left = Math.random() * 100;
            const duration = 6 + Math.random() * 10;
            const opacity = 0.4 + Math.random() * 0.6;
            const delay = Math.random() * 5;

            flake.style.cssText = `
                position: absolute;
                top: -20px;
                left: ${left}vw;
                font-size: ${size}px;
                opacity: ${opacity};
                color: #9ab5ff;
                font-family: monospace;
                user-select: none;
                animation: snowfall ${duration}s linear infinite;
                animation-delay: ${delay}s;
            `;
            snowContainer.appendChild(flake);
        }

        // === COUNTDOWN TO JAN 1, 2026 00:00 UTC+3 ===
        const countdownEl = document.getElementById('ny-countdown');

        function updateCountdown() {
            const ny2026UTC = Date.UTC(2026, 11, 31, 21, 0, 0);
            const diff = ny2026UTC - Date.now();

            if (diff <= 0) {
                countdownEl.textContent = 'С Новым Годом 2026!';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((diff % (1000 * 60)) / 1000);

            countdownEl.textContent = `Новый Год через: ${days}д ${hours}ч ${mins}м ${secs}с`;
        }

        if (!document.getElementById('ny-snow-style')) {
            const style = document.createElement('style');
            style.id = 'ny-snow-style';
            style.textContent = `
                @keyframes snowfall {
                    0% { transform: translateY(-10vh) rotate(0deg); }
                    100% { transform: translateY(110vh) rotate(360deg); }
                }
            `;
            document.head.appendChild(style);
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // CUBE

        const BACKGROUND = "#121212"
        const FOREGROUND = "#E33533"
        
        console.log(rast)
        rast.width = 200
        rast.height = 200
        const ctx = rast.getContext("2d")
        console.log(ctx)
        
        function clear() {
            ctx.fillStyle = BACKGROUND
            ctx.fillRect(0, 0, rast.width, rast.height)
        }
        
        function point({x, y}) {
            const s = 10
            ctx.fillStyle = FOREGROUND
            ctx.fillRect(x - s/2, y - s/2, s, s)
        }
        
        function line(p1, p2) {
            ctx.strokeStyle = FOREGROUND;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
        }
        
        function screen(p) {
            return {
                x: (p.x + 1)/2 * rast.width,
                y: (1 - (p.y + 1)/2) * rast.height,
            }
        }
        
        function project({x, y, z}) {
            return {
                x: x/z,
                y: y/z,
            }
        }
        
        function translate_z({x, y, z}, dz) {
            return {x, y, z: z + dz};
        }
        
        function rotate_xz({x, y, z}, angle) {
            const c = Math.cos(angle);
            const s = Math.sin(angle);
            return {
                x: x*c-z*s,
                y,
                z: x*s+z*c,
            };
        }
        
        const vs = [
            {x:  0.3, y:  0.3, z:  0.3},
            {x: -0.3, y:  0.3, z:  0.3},
            {x: -0.3, y: -0.3, z:  0.3},
            {x:  0.3, y: -0.3, z:  0.3},
        
            {x:  0.3, y:  0.3, z: -0.3},
            {x: -0.3, y:  0.3, z: -0.3},
            {x: -0.3, y: -0.3, z: -0.3},
            {x:  0.3, y: -0.3, z: -0.3},
        ]
        
        const fs = [
            [0, 1, 2, 3],
            [4, 5, 6, 7],
            [0, 4],
            [1, 5],
            [2, 6],
            [3, 7],
        ]
        
        const FPS = 60;
        let dz = 1;
        let angle = 0;
        
        function frame() {
            const dt = 1/FPS;
            // dz += 1 * dt
            angle += Math.PI*dt;
            clear()
            //for (const v of vs) {
            //    point(screen(project(translate_z(rotate_xz(v, angle), dz))))
            //}
            for (const f of fs) {
                for (let i = 0; i < f.length; ++i) {
                    const a = vs[f[i]];
                    const b = vs[f[(i+1)%f.length]];
                    line(
                    screen(project(translate_z(rotate_xz(a, angle), dz))),
                    screen(project(translate_z(rotate_xz(b, angle), dz)))
                    );
        
                }
            }
            setTimeout(frame, 1000/FPS);
        }
        
        setTimeout(frame, 1000/FPS);
    </script>

</body>

</html>
