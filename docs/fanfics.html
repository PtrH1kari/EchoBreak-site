<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoBreak - Фанфики</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/favicon.png">
</head>

<body>
    <!-- Header -->
    <header>
        <a href="index.html" id="logo-link">
            <img src="images/logo.png" alt="EchoBreak Logo" class="logo">
        </a>
        <nav>
            <ul>
                <li><a href="about.html">О нас</a></li>
                <li><a href="projects.html">Проекты</a></li>
                <li><a href="fanfics.html" class="active">Комьюнити</a></li>
                <li><a href="crypto.html">Крипта</a></li>
                <li>
                    <a href="personal_account.html" class="account-icon">
                        <img src="images/avatar-placeholder.png" alt="Аккаунт">
                    </a>
                </li>
            </ul>
        </nav>
    </header>
    <div class="separator"></div>

    <!-- Main Content -->
    <main>
        <h1>EchoBreak</h1>
        <h2>Фанфики</h2>

        <div class="buttons-container" style="margin-bottom:10px;">
            <button class="transparent-button" id="viewStarredButton">Избранное</button>
            <button class="transparent-button" id="viewStatsButton">Статистика</button>
        </div>

        <div id="gistsList" class="fanfic-grid"></div>

        <!-- ===================== MODALS ===================== -->

        <!-- Reader -->
        <div id="fanficModal" class="modal">
            <div class="modal-content full-screen">
                <span class="close-modal">&times;</span>
                <div class="modal-header">
                    <div class="modal-title-container">
                        <h2 id="fanficTitle"></h2>
                        <div class="modal-actions">
                            <button id="starButton" class="star-button">☆ В избранное</button>
                            <button id="viewAuthorButton" class="author-button">Автор</button>
                            <button id="toggleReadingMode" class="reading-mode-button">◐</button>
                        </div>
                    </div>
                    <p id="fanficAuthorDate"></p>
                    <p id="fanficStats"></p>
                </div>
                <hr class="modal-separator">
                <div id="fanficContent"></div>
            </div>
        </div>

        <!-- Author -->
        <div id="authorModal" class="modal">
            <div class="modal-content">
                <span class="close-modal author-close">&times;</span>
                <h2 id="authorName"></h2>
                <div id="authorStats"></div>
                <h3>Другие фанфики автора:</h3>
                <div id="authorFanfics" class="author-fanfics-list"></div>
            </div>
        </div>

        <!-- Favorites -->
        <div id="starredModal" class="modal">
            <div class="modal-content star">
                <span class="close-modal starred-close">&times;</span>
                <h2>Избранные фанфики</h2>
                <div id="starredFanficsList"></div>
            </div>
        </div>

        <!-- Stats -->
        <div id="statsModal" class="modal">
            <div class="modal-content">
                <span class="close-modal stats-close">&times;</span>
                <h2>Статистика</h2>
                <div id="statsContent">
                    <div class="stats-summary">
                        <h3>Общая статистика</h3>
                        <div id="globalStats">Загрузка...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- NSFW gate -->
        <div id="nsfwWarningModal" class="modal">
            <div class="modal-content" style="max-width: 450px; padding: 20px; text-align: center;">
                <h2>Внимание: NSFW</h2>
                <p>Этот фанфик содержит контент 18+.</p>
                <p>Вы подтверждаете, что хотите продолжить?</p>
                <div style="margin-top: 20px;">
                    <button class="button" id="showNsfwContent">Продолжить</button>
                    <button class="transparent-button" id="cancelNsfw">Назад</button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>EchoBreak © 2025-2026</p>
    </footer>

    <script src="fanfics.js"></script>
</body>

</html>
